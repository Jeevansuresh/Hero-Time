name: ember
description: Hero Time, a Ben 10 themed habit tracker. Log missions, charge the Omnitrix, unlock alien DNA.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.2
  flutter_local_notifications: 17.2.4
  timezone: ^0.9.4
  google_fonts: ^6.2.1
  audioplayers: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/app_icon.png
  adaptive_icon_background: "#040805"
  adaptive_icon_foreground: assets/icon/app_icon_fg.png
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/sfx/
    - assets/brand/
    - assets/aliens/
