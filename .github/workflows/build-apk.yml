name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        # Explicit bash = `bash -eo pipefail`, so `cmd | tee log` fails when cmd fails.
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.38.7 # the version the app is tested with locally
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Generate Android project
        run: |
          mkdir -p assets/sfx && python3 tool/gen_sfx.py assets/sfx 2>&1 | tee create.log
          flutter create --platforms=android --org com.jeevan --project-name ember . 2>&1 | tee -a create.log
          dart run tool/setup_android.dart 2>&1 | tee -a create.log
          flutter pub get 2>&1 | tee -a create.log
          dart run flutter_launcher_icons 2>&1 | tee -a create.log

      # Every release must be signed with the same key, or Android refuses to update the
      # installed app (you'd have to uninstall it, which wipes your data).
      - name: Release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Signing secrets are missing. Add KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD in Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=upload.jks\n' \
            "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > android/key.properties

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee analyze.log

      - name: Test
        run: flutter test 2>&1 | tee test.log

      - name: Build release APK
        run: flutter build apk --release 2>&1 | tee build.log

      - name: Check the APK is signed with the Hero Time key
        run: |
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          "$apksigner" verify --print-certs build/app/outputs/flutter-apk/app-release.apk | tee sign.log
          # SHA-256 of the release certificate (public, not a secret).
          grep -qi "SHA-256 digest: 8b4df2a1fb6a243c8df10eed7cdcb9f6c45673b578eac555944d9b45c40bda7b" sign.log \
            || { echo "::error::APK is not signed with the Hero Time release key"; exit 1; }

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Hero Time build ${{ github.run_number }}
          body: Install app-release.apk on your Android phone (allow installs from this source when asked).
          files: build/app/outputs/flutter-apk/app-release.apk

      - name: Report failure as an issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            for f in create.log analyze.log test.log build.log; do
              if [ -f "$f" ]; then
                echo; echo "## $f"; echo '```'
                grep -E "error|Error|ERROR|FAILURE|What went wrong|Exception|✗" -A3 "$f" | tail -n 80 || true
                echo '...'; tail -n 60 "$f"; echo '```'
              fi
            done
          } > report.md
          gh issue create --title "Build ${{ github.run_number }} failed" --body-file report.md
